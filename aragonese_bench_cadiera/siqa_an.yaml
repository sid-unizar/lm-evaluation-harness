task: siqa_an
dataset_path: cadiera/SIQA_an
output_type: multiple_choice
training_split: null
validation_split: train
test_split: null
doc_to_text: "Pregunta: {{context}} {{question}}\nRespuesta:"
target_delimiter: " "
doc_to_choice: "{{ [answer_a, answer_b, answer_c] | tojson }}"
doc_to_target: "{{ (label|int) - 1 }}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0